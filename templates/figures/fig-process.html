<figure class="fig" id="fig-process" aria-labelledby="fig-process-t">
  <p class="fig-title" id="fig-process-t">A sale is a funnel that narrows for months</p>
  <p class="fig-sub">Read from the top. Many buyers see the teaser, and only one is left once the LOI is signed.</p>
  <ol class="fig-process-steps" role="list">
    <li class="fig-process-step" data-key="prep" style="--t:6%;--b:6%">
      <span class="fig-process-fun" aria-hidden="true"><span class="fig-process-shape"></span></span>
      <div class="fig-process-txt">
        <p class="fig-process-name" data-k="timeline.steps[key=prep].step" data-f="raw">Seller gets ready</p>
        <p class="fig-process-when" data-k="timeline.steps[key=prep].typical" data-f="raw">2 to 4 months</p>
      </div>
    </li>
    <li class="fig-process-step" data-key="market" style="--t:100%;--b:72%">
      <span class="fig-process-fun" aria-hidden="true"><span class="fig-process-shape"></span></span>
      <div class="fig-process-txt">
        <p class="fig-process-tag">Many buyers</p>
        <p class="fig-process-name" data-k="timeline.steps[key=market].step" data-f="raw">Teaser, NDA and CIM</p>
        <p class="fig-process-when" data-k="timeline.steps[key=market].typical" data-f="raw">4 to 8 weeks</p>
      </div>
    </li>
    <li class="fig-process-step" data-key="ioi" style="--t:72%;--b:30%">
      <span class="fig-process-fun" aria-hidden="true"><span class="fig-process-shape"></span></span>
      <div class="fig-process-txt">
        <p class="fig-process-tag">A shorter list</p>
        <p class="fig-process-name" data-k="timeline.steps[key=ioi].step" data-f="raw">IOIs and management meetings</p>
        <p class="fig-process-when" data-k="timeline.steps[key=ioi].typical" data-f="raw">4 to 8 weeks</p>
      </div>
    </li>
    <li class="fig-process-step fig-process-loi" data-key="loi" style="--t:30%;--b:9%">
      <span class="fig-process-fun" aria-hidden="true"><span class="fig-process-shape"></span>
        <svg class="fig-process-lock" viewBox="0 0 24 24" focusable="false"><rect class="fig-process-lockbg" x="1" y="1" width="22" height="22" rx="6"/><rect class="fig-process-lockbody" x="6.5" y="11" width="11" height="8" rx="2"/><path class="fig-process-lockarc" d="M9 11V8.5a3 3 0 0 1 6 0V11"/></svg>
      </span>
      <div class="fig-process-txt">
        <p class="fig-process-tag">One buyer, exclusive</p>
        <p class="fig-process-name" data-k="timeline.steps[key=loi].step" data-f="raw">LOI signed, exclusivity starts</p>
        <p class="fig-process-when" data-k="timeline.steps[key=loi].typical" data-f="raw">60 to 90 days of exclusivity and diligence</p>
      </div>
    </li>
    <li class="fig-process-step fig-process-par" data-key="par" style="--t:9%;--b:9%">
      <span class="fig-process-fun" aria-hidden="true"><span class="fig-process-shape"></span></span>
      <div class="fig-process-txt">
        <p class="fig-process-parh">Then three jobs run at the same time</p>
        <ul class="fig-process-lanes" role="list">
          <li class="fig-process-lane fig-process-qoe" data-key="qoe" style="--w:46%">
            <p class="fig-process-name" data-k="timeline.steps[key=qoe].step" data-f="raw">Quality of earnings</p>
            <p class="fig-process-when" data-k="timeline.steps[key=qoe].typical" data-f="raw">4 to 6 weeks</p>
            <span class="fig-process-bar" aria-hidden="true"></span>
          </li>
          <li class="fig-process-lane fig-process-sba" data-key="sba" style="--w:80%">
            <p class="fig-process-name" data-k="timeline.steps[key=sba].step" data-f="raw">SBA loan approval</p>
            <p class="fig-process-when" data-k="timeline.steps[key=sba].typical" data-f="raw">30 to 90 days from application to closing</p>
            <span class="fig-process-bar" aria-hidden="true"></span>
          </li>
          <li class="fig-process-lane fig-process-docs" data-key="docs" style="--w:100%">
            <p class="fig-process-name" data-k="timeline.steps[key=docs].step" data-f="raw">Diligence and purchase agreement</p>
            <p class="fig-process-when" data-k="timeline.steps[key=docs].typical" data-f="raw">6 to 12 weeks</p>
            <span class="fig-process-bar" aria-hidden="true"></span>
          </li>
        </ul>
      </div>
    </li>
    <li class="fig-process-step fig-process-close" data-key="close" style="--t:9%;--b:9%">
      <span class="fig-process-fun" aria-hidden="true"><span class="fig-process-shape"></span></span>
      <div class="fig-process-txt">
        <p class="fig-process-name" data-k="timeline.steps[key=close].step" data-f="raw">Closing</p>
        <p class="fig-process-when" data-k="timeline.steps[key=close].typical" data-f="raw">2 to 6 weeks</p>
      </div>
    </li>
  </ol>
  <div class="fig-process-total">
    <p class="fig-process-totl">In all, typically</p>
    <p class="fig-process-totv" data-k="timeline.total" data-f="raw">6 to 12 months</p>
  </div>
  <p class="fig-process-note" data-k="timeline.note" data-f="raw">Main Street deals took 6 to 10 months to close and lower-middle-market deals 11 to 12 months in Q2 2026 (IBBA).</p>
  <p class="fig-process-gl">Teaser: a short anonymous summary, usually one or two pages. NDA: a promise to keep it private. CIM: the company's detailed sales document. IOI: a first price signal that does not bind anyone. LOI: the signed offer letter that lays out price and terms; most of it can still change after diligence. Exclusivity: the seller deals only with you for a set time. Diligence: checking that what the seller said is true. Quality of earnings: an accountant's check that the profit is real.</p>
  <figcaption>Sources: BD Emerson 2026 (sell-side process, due diligence, quality of earnings); Surge Business Law 2026 (SBA loan timing); IBBA and M&amp;A Source Market Pulse Q2 2026 press release. Times are typical ranges, not promises. The bars show that the three jobs overlap, not their exact length. SBA timing is one law firm's estimate; confirm with your lender.</figcaption>
</figure>
