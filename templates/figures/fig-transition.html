<figure class="fig" id="fig-transition" aria-labelledby="fig-transition-t">
  <p class="fig-title" id="fig-transition-t">The seller hands over the keys, slowly</p>
  <p class="fig-sub">The seller's part shrinks while the new owner's part grows. The bands are a sketch, not to scale.</p>
  <ul class="fig-transition-key" role="list">
    <li><span class="fig-transition-sw fig-transition-sw-s" aria-hidden="true"></span>The seller's part</li>
    <li><span class="fig-transition-sw fig-transition-sw-n" aria-hidden="true"></span>The new owner's part</li>
  </ul>
  <ol class="fig-transition-steps" role="list">
    <li class="fig-transition-step" data-key="shadow" style="--a:94%;--z:72%">
      <span class="fig-transition-band" aria-hidden="true"><span class="fig-transition-sel"></span></span>
      <div class="fig-transition-txt">
        <p class="fig-transition-name">Side by side</p>
        <p class="fig-transition-when" data-k="transition.phases[key=shadow].when" data-f="raw">Weeks 1 to 4</p>
        <p class="fig-transition-role">Seller: full time</p>
        <p class="fig-transition-what" data-k="transition.phases[key=shadow].what" data-f="raw">Seller works alongside every day; introductions to key customers, suppliers and staff</p>
        <p class="fig-transition-plan" data-key="shadow">An example plan</p>
      </div>
    </li>
    <li class="fig-transition-step" data-key="handover" style="--a:72%;--z:32%">
      <span class="fig-transition-band" aria-hidden="true"><span class="fig-transition-sel"></span></span>
      <div class="fig-transition-txt">
        <p class="fig-transition-name">Handing over</p>
        <p class="fig-transition-when" data-k="transition.phases[key=handover].when" data-f="raw">Months 2 to 6</p>
        <p class="fig-transition-role">Seller: part time</p>
        <p class="fig-transition-what" data-k="transition.phases[key=handover].what" data-f="raw">Part time; relationships and know-how move to the new owner</p>
        <p class="fig-transition-plan" data-key="handover">An example plan</p>
      </div>
    </li>
    <li class="fig-transition-step" data-key="oncall" style="--a:32%;--z:8%">
      <span class="fig-transition-band" aria-hidden="true"><span class="fig-transition-sel"></span></span>
      <div class="fig-transition-txt">
        <p class="fig-transition-name">On call</p>
        <p class="fig-transition-when" data-k="transition.phases[key=oncall].when" data-f="raw">Up to month 24</p>
        <p class="fig-transition-role">Seller: on call</p>
        <p class="fig-transition-what" data-k="transition.phases[key=oncall].what" data-f="raw">On call as a consultant, the most the new SBA rules allow (one reading; confirm with your lender)</p>
        <p class="fig-transition-plan is-rule" data-key="oncall">The rule, not a plan</p>
      </div>
    </li>
  </ol>
  <div class="fig-transition-limit">
    <svg class="fig-transition-flag" viewBox="0 0 24 28" aria-hidden="true" focusable="false"><path class="fig-transition-pole" d="M5 26V3"/><path class="fig-transition-flagc" d="M5 4H20L16 9.5L20 15H5Z"/></svg>
    <div class="fig-transition-limtx">
      <p class="fig-transition-lim1">Month <span class="num" data-k="transition.sba_max_months" data-f="n0">24</span>: the most a selling owner can stay on as a consultant</p>
      <p class="fig-transition-lim2">Up from <span class="num" data-k="transition.sba_prior_months" data-f="n0">12</span> months under the old rules. One reading of the current SBA rules; confirm with your lender.</p>
    </div>
  </div>
  <figcaption>Source: Starfield &amp; Smith 2026 on SBA SOP 50 10 8.1 (the SBA's rulebook for lenders). The weekly plan is an example, not a rule. One law firm's reading; confirm with your lender.</figcaption>
