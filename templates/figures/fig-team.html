<figure class="fig" id="fig-team" aria-labelledby="fig-team-t">
  <p class="fig-title" id="fig-team-t">It takes a small team to buy a small company</p>
  <p class="fig-sub">Two sides face each other across the purchase agreement.</p>
  <p class="fig-team-key">M&amp;A: mergers and acquisitions, the work of buying and selling companies. SBA: the U.S. Small Business Administration, whose loan program the lender uses.</p>
  <p class="fig-team-hint" hidden>Tap a person to see what they do.</p>
  <div class="fig-team-board">
    <div class="fig-team-side fig-team-sellers" role="group" aria-labelledby="fig-team-sellers-h">
      <p class="fig-team-side-h" id="fig-team-sellers-h">The seller's side</p>
      <ul class="fig-team-list" role="list">
        <li class="fig-team-person fig-team-founder">
          <button type="button" class="fig-team-btn" aria-expanded="true" aria-controls="fig-team-d-founder"><span class="fig-team-name">The founder</span></button>
          <p class="fig-team-what" id="fig-team-d-founder">Built the company and knows it best. Chooses the buyer and usually stays on for a while to hand it over.</p>
        </li>
        <li class="fig-team-person fig-team-adv">
          <button type="button" class="fig-team-btn" aria-expanded="true" aria-controls="fig-team-d-broker"><span class="fig-team-name">A business broker or M&amp;A advisor</span></button>
          <p class="fig-team-what" id="fig-team-d-broker">Prepares the sale, finds buyers and negotiates for the seller. Brokers handle the smallest companies; advisors the next size up.</p>
          <p class="fig-team-cost"><span class="fig-team-cost-h">What it costs</span><span data-k="team.broker_fee" data-f="raw">Paid by the seller: typically 8% to 12% of the price on Main Street deals</span></p>
        </li>
        <li class="fig-team-person fig-team-adv">
          <button type="button" class="fig-team-btn" aria-expanded="true" aria-controls="fig-team-d-slawyer"><span class="fig-team-name">The seller's lawyer</span></button>
          <p class="fig-team-what" id="fig-team-d-slawyer">Protects the seller in the contract: what is promised, what is left out, and how much risk stays with the seller.</p>
        </li>
        <li class="fig-team-person fig-team-adv">
          <button type="button" class="fig-team-btn" aria-expanded="true" aria-controls="fig-team-d-sacct"><span class="fig-team-name">The seller's accountant</span></button>
          <p class="fig-team-what" id="fig-team-d-sacct">Prepared the books and tax returns I will be checking, and answers my accountant's questions about them.</p>
        </li>
      </ul>
    </div>

    <div class="fig-team-middle">
      <svg class="fig-team-doc" viewBox="0 0 24 28" aria-hidden="true" focusable="false">
        <path class="fig-team-doc-page" d="M4 2h11l5 5v19H4z"/>
        <path class="fig-team-doc-fold" d="M15 2v5h5"/>
        <path class="fig-team-doc-line" d="M8 13h8M8 17h8M8 21h5"/>
      </svg>
      <div class="fig-team-mid-text">
        <p class="fig-team-mid-name">The purchase agreement</p>
        <p class="fig-team-mid-what">The contract both sides sign at closing. Everyone on this page works toward it.</p>
      </div>
    </div>

    <div class="fig-team-side fig-team-buyers" role="group" aria-labelledby="fig-team-buyers-h">
      <p class="fig-team-side-h" id="fig-team-buyers-h">The buyer's side</p>
      <ul class="fig-team-list" role="list">
        <li class="fig-team-person fig-team-me">
          <button type="button" class="fig-team-btn" aria-expanded="true" aria-controls="fig-team-d-me"><span class="fig-team-name">Me, the buyer and future operator</span></button>
          <p class="fig-team-what" id="fig-team-d-me">I lead the search, ask the questions, decide what to pay and would run the company afterward. I rely on everyone else on this side.</p>
        </li>
        <li class="fig-team-person fig-team-lender">
          <button type="button" class="fig-team-btn" aria-expanded="true" aria-controls="fig-team-d-lender"><span class="fig-team-name">The SBA lender</span></button>
          <p class="fig-team-what" id="fig-team-d-lender">A bank that lends under the SBA's loan program. It checks that the company's cash can carry the loan. Confirm any SBA rule with your lender.</p>
        </li>
        <li class="fig-team-person fig-team-adv">
          <button type="button" class="fig-team-btn" aria-expanded="true" aria-controls="fig-team-d-mlawyer"><span class="fig-team-name">An M&amp;A lawyer</span></button>
          <p class="fig-team-what" id="fig-team-d-mlawyer">Negotiates the purchase agreement, reads the contracts and leases, and spots legal risks before I sign.</p>
        </li>
        <li class="fig-team-person fig-team-adv">
          <button type="button" class="fig-team-btn" aria-expanded="true" aria-controls="fig-team-d-qoe"><span class="fig-team-name">A quality of earnings accountant</span></button>
          <p class="fig-team-what" id="fig-team-d-qoe">Tests whether the earnings are real and will repeat, including whether the bank deposits match the reported sales.</p>
          <p class="fig-team-cost"><span class="fig-team-cost-h">What it costs</span><span data-k="team.qoe_fee" data-f="raw">Typically $20K to $35K and 4 to 6 weeks for a company worth under $5M</span></p>
        </li>
        <li class="fig-team-person fig-team-adv">
          <button type="button" class="fig-team-btn" aria-expanded="true" aria-controls="fig-team-d-ins"><span class="fig-team-name">An insurance broker</span></button>
          <p class="fig-team-what" id="fig-team-d-ins">Learns what has gone wrong before, finds gaps in coverage and arranges cover that starts on the first day.</p>
        </li>
        <li class="fig-team-person fig-team-adv">
          <button type="button" class="fig-team-btn" aria-expanded="true" aria-controls="fig-team-d-tax"><span class="fig-team-name">A tax advisor</span></button>
          <p class="fig-team-what" id="fig-team-d-tax">Looks for hidden tax bills and advises on how to structure the purchase: buying the assets or buying the shares.</p>
        </li>
        <li class="fig-team-person fig-team-adv">
          <button type="button" class="fig-team-btn" aria-expanded="true" aria-controls="fig-team-d-mentor"><span class="fig-team-name">An industry mentor</span></button>
          <p class="fig-team-what" id="fig-team-d-mentor">Someone who has run a similar company. Tells me what is normal, what is a red flag and who to call.</p>
        </li>
      </ul>
    </div>
  </div>
  <figcaption>Sources: CT Acquisitions 2026 fee guide; BD Emerson 2026 QoE cost guide. Fees are typical ranges, not quotes.</figcaption>
</figure>
