<figure class="fig" id="fig-sellers" aria-labelledby="fig-sellers-t">
  <p class="fig-title" id="fig-sellers-t">The size of the company decides who sells it</p>
  <p class="fig-sub">Bigger companies move up the ladder to more formal sellers. Two side channels reach companies of any size.</p>
  <div class="fig-sellers-body">
    <p class="fig-sellers-end fig-sellers-lo">Smaller company</p>
    <div class="fig-sellers-lad">
      <span class="fig-sellers-rail" aria-hidden="true"></span>
      <ol class="fig-sellers-rungs">
        <li class="fig-sellers-card fig-sellers-rung" data-key="broker" style="--nd:14px">
          <svg class="fig-sellers-bars" viewBox="0 0 28 20" aria-hidden="true" focusable="false"><rect class="on" x="2" y="12" width="6" height="6" rx="1"/><rect x="11" y="7" width="6" height="11" rx="1"/><rect x="20" y="2" width="6" height="16" rx="1"/></svg>
          <p class="fig-sellers-name" data-k="sellers.rows[key=broker].name" data-f="raw">Business broker</p>
          <p class="fig-sellers-size" data-k="sellers.rows[key=broker].size" data-f="raw">Main Street: under $2M of value</p>
          <dl class="fig-sellers-rows">
            <div class="fig-sellers-fee"><dt>Fee, paid by the seller</dt><dd data-k="sellers.rows[key=broker].fee" data-f="raw">8% to 12% of the price, often a $25K to $75K minimum</dd></div>
            <div><dt>Price</dt><dd data-k="sellers.rows[key=broker].multiple" data-f="raw">2.0x to 3.1x SDE</dd></div>
            <div><dt>Time</dt><dd data-k="sellers.rows[key=broker].time" data-f="raw">6 to 10 months to close</dd></div>
            <div><dt>Good to know</dt><dd data-k="sellers.rows[key=broker].tip" data-f="raw">Many buyers: be quick, prepared and financeable</dd></div>
          </dl>
        </li>
        <li class="fig-sellers-card fig-sellers-rung" data-key="advisor" style="--nd:20px">
          <svg class="fig-sellers-bars" viewBox="0 0 28 20" aria-hidden="true" focusable="false"><rect class="on" x="2" y="12" width="6" height="6" rx="1"/><rect class="on" x="11" y="7" width="6" height="11" rx="1"/><rect x="20" y="2" width="6" height="16" rx="1"/></svg>
          <p class="fig-sellers-name" data-k="sellers.rows[key=advisor].name" data-f="raw">M&amp;A advisor</p>
          <p class="fig-sellers-size" data-k="sellers.rows[key=advisor].size" data-f="raw">Lower middle market: $2M to $50M</p>
          <dl class="fig-sellers-rows">
            <div class="fig-sellers-fee"><dt>Fee, paid by the seller</dt><dd data-k="sellers.rows[key=advisor].fee" data-f="raw">About 5% to 12%, falling as deals get bigger</dd></div>
            <div><dt>Price</dt><dd data-k="sellers.rows[key=advisor].multiple" data-f="raw">4.0x to 5.8x EBITDA</dd></div>
            <div><dt>Time</dt><dd data-k="sellers.rows[key=advisor].time" data-f="raw">11 to 12 months to close</dd></div>
            <div><dt>Good to know</dt><dd data-k="sellers.rows[key=advisor].tip" data-f="raw">Formal process: 87% of $5M-plus deals drew 3 or more offers</dd></div>
          </dl>
        </li>
        <li class="fig-sellers-card fig-sellers-rung" data-key="bank" style="--nd:26px">
          <svg class="fig-sellers-bars" viewBox="0 0 28 20" aria-hidden="true" focusable="false"><rect class="on" x="2" y="12" width="6" height="6" rx="1"/><rect class="on" x="11" y="7" width="6" height="11" rx="1"/><rect class="on" x="20" y="2" width="6" height="16" rx="1"/></svg>
          <p class="fig-sellers-name" data-k="sellers.rows[key=bank].name" data-f="raw">Investment bank</p>
          <p class="fig-sellers-size" data-k="sellers.rows[key=bank].size" data-f="raw">Larger companies, $25M and up</p>
          <dl class="fig-sellers-rows">
            <div class="fig-sellers-fee"><dt>Fee, paid by the seller</dt><dd data-k="sellers.rows[key=bank].fee" data-f="raw">About 2% to 5% on $25M to $100M deals</dd></div>
            <div><dt>Price</dt><dd data-k="sellers.rows[key=bank].multiple" data-f="raw">Middle-market average 7.0x EBITDA</dd></div>
            <div><dt>Time</dt><dd data-k="sellers.rows[key=bank].time" data-f="raw">Run as an auction with IOIs and LOIs</dd></div>
            <div><dt>Good to know</dt><dd data-k="sellers.rows[key=bank].tip" data-f="raw">Mostly private equity funds and big companies bidding</dd></div>
          </dl>
        </li>
      </ol>
    </div>
    <p class="fig-sellers-end fig-sellers-hi">Larger company</p>
    <div class="fig-sellers-sidehead">
      <svg class="fig-sellers-bars fig-sellers-any" viewBox="0 0 28 20" aria-hidden="true" focusable="false"><rect class="on" x="2" y="12" width="6" height="6" rx="1"/><rect class="on" x="11" y="7" width="6" height="11" rx="1"/><rect class="on" x="20" y="2" width="6" height="16" rx="1"/></svg>
      <p class="fig-sellers-sidet">Two side channels, open to companies of any size</p>
    </div>
    <ul class="fig-sellers-side">
      <li class="fig-sellers-card fig-sellers-mkt" data-key="marketplace">
        <p class="fig-sellers-name" data-k="sellers.rows[key=marketplace].name" data-f="raw">Marketplaces</p>
        <p class="fig-sellers-size" data-k="sellers.rows[key=marketplace].size" data-f="raw">Listings from brokers and owners</p>
        <dl class="fig-sellers-rows">
          <div class="fig-sellers-fee"><dt>Fee</dt><dd data-k="sellers.rows[key=marketplace].fee" data-f="raw">Paid by the seller or broker</dd></div>
          <div><dt>Price</dt><dd data-k="sellers.rows[key=marketplace].multiple" data-f="raw">Median sale $350,000 (BizBuySell, Q3 2026)</dd></div>
          <div><dt>Volume</dt><dd data-k="sellers.rows[key=marketplace].time" data-f="raw">2,132 sales closed in Q3 2026</dd></div>
          <div><dt>Good to know</dt><dd data-k="sellers.rows[key=marketplace].tip" data-f="raw">Easy to browse, crowded with buyers</dd></div>
        </dl>
      </li>
      <li class="fig-sellers-card fig-sellers-dir" data-key="direct">
        <p class="fig-sellers-name" data-k="sellers.rows[key=direct].name" data-f="raw">Direct outreach</p>
        <p class="fig-sellers-size" data-k="sellers.rows[key=direct].size" data-f="raw">Owners who have not decided to sell</p>
        <dl class="fig-sellers-rows">
          <div class="fig-sellers-fee"><dt>Fee</dt><dd data-k="sellers.rows[key=direct].fee" data-f="raw">No broker fee for the seller</dd></div>
          <div><dt>Price</dt><dd data-k="sellers.rows[key=direct].multiple" data-f="raw">Negotiated one to one</dd></div>
          <div><dt>Time</dt><dd data-k="sellers.rows[key=direct].time" data-f="raw">Slow: letters, calls, relationships</dd></div>
          <div><dt>Good to know</dt><dd data-k="sellers.rows[key=direct].tip" data-f="raw">70% of owners have no formal succession plan</dd></div>
        </dl>
      </li>
    </ul>
  </div>
  <figcaption>Sources: IBBA and M&amp;A Source Market Pulse Q2 2026 and its press release; CT Acquisitions 2026 fee guide; GF Data via ACG 2026; BizBuySell Q3 2026; JPMorgan Chase 2026. Fees are typical ranges; sellers pay them. SDE is profit plus the owner's pay; EBITDA is profit before interest, taxes and the wear on assets. IOI and LOI are a first price signal and a formal offer letter.</figcaption>
</figure>
