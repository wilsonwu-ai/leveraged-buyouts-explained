<figure class="fig" id="fig-models" aria-labelledby="fig-models-t">
  <p class="fig-title" id="fig-models-t">Same math, four ways to fund it</p>
  <p class="fig-sub">The top edge shows who puts up the money: green is the searcher, terracotta is outside investors.</p>
  <p class="fig-models-hint" hidden>Tap a card to show or hide its evidence.</p>
  <ul class="fig-models-grid" role="list">
    <li class="fig-models-card" data-key="traditional" data-eq="inv">
      <button type="button" class="fig-models-btn" aria-expanded="true" aria-controls="fig-models-r-traditional"><span class="fig-models-name" data-k="models.rows[key=traditional].name" data-f="raw">Traditional search fund</span></button>
      <dl class="fig-models-rows">
        <div class="fig-models-row"><dt>Who pays</dt><dd data-k="models.rows[key=traditional].who_pays" data-f="raw">Investors pay for the search, about $400K to $500K</dd></div>
        <div class="fig-models-row"><dt>Owner share</dt><dd data-k="models.rows[key=traditional].owner_share" data-f="raw">Searcher earns roughly a quarter to a third</dd></div>
        <div class="fig-models-row"><dt>Size</dt><dd data-k="models.rows[key=traditional].size" data-f="raw">Median price $16M (2024 to 2025 deals)</dd></div>
        <div class="fig-models-row"><dt>Time</dt><dd data-k="models.rows[key=traditional].time" data-f="raw">About 20 months to buy</dd></div>
      </dl>
      <div class="fig-models-res" id="fig-models-r-traditional">
        <p class="fig-models-rl">The evidence</p>
        <p class="fig-models-rv" data-k="models.rows[key=traditional].result" data-f="raw">58% buy a company; pooled IRR 33.9%</p>
      </div>
    </li>
    <li class="fig-models-card fig-models-mine" data-key="self-funded" data-eq="own">
      <button type="button" class="fig-models-btn" aria-expanded="true" aria-controls="fig-models-r-self"><span class="fig-models-name" data-k="models.rows[key=self-funded].name" data-f="raw">Self-funded search</span></button>
      <span class="fig-models-tag">My path</span>
      <dl class="fig-models-rows">
        <div class="fig-models-row"><dt>Who pays</dt><dd data-k="models.rows[key=self-funded].who_pays" data-f="raw">The searcher, about $100K to $200K of their own money</dd></div>
        <div class="fig-models-row"><dt>Owner share</dt><dd data-k="models.rows[key=self-funded].owner_share" data-f="raw">Searcher can keep up to 100%</dd></div>
        <div class="fig-models-row"><dt>Size</dt><dd data-k="models.rows[key=self-funded].size" data-f="raw">Smaller deals, usually with an SBA loan (7(a) loans up to $5M)</dd></div>
        <div class="fig-models-row"><dt>Time</dt><dd data-k="models.rows[key=self-funded].time" data-f="raw">Often 12 to 24 months</dd></div>
      </dl>
      <div class="fig-models-res" id="fig-models-r-self">
        <p class="fig-models-rl">The evidence</p>
        <p class="fig-models-rv" data-k="models.rows[key=self-funded].result" data-f="raw">Not covered by Stanford's 2024 study</p>
      </div>
    </li>
    <li class="fig-models-card" data-key="sponsor" data-eq="inv">
      <button type="button" class="fig-models-btn" aria-expanded="true" aria-controls="fig-models-r-sponsor"><span class="fig-models-name" data-k="models.rows[key=sponsor].name" data-f="raw">Independent sponsor</span></button>
      <dl class="fig-models-rows">
        <div class="fig-models-row"><dt>Who pays</dt><dd data-k="models.rows[key=sponsor].who_pays" data-f="raw">No fund: finds and signs a deal first, then raises money for that one deal</dd></div>
        <div class="fig-models-row"><dt>Owner share</dt><dd data-k="models.rows[key=sponsor].owner_share" data-f="raw">Negotiated deal by deal</dd></div>
        <div class="fig-models-row"><dt>Size</dt><dd data-k="models.rows[key=sponsor].size" data-f="raw">Varies by deal</dd></div>
        <div class="fig-models-row"><dt>Time</dt><dd data-k="models.rows[key=sponsor].time" data-f="raw">Deal by deal</dd></div>
      </dl>
      <div class="fig-models-res" id="fig-models-r-sponsor">
        <p class="fig-models-rl">The evidence</p>
        <p class="fig-models-rv" data-k="models.rows[key=sponsor].result" data-f="raw">No industry-wide study cited here</p>
      </div>
    </li>
    <li class="fig-models-card" data-key="pe" data-eq="inv">
      <button type="button" class="fig-models-btn" aria-expanded="true" aria-controls="fig-models-r-pe"><span class="fig-models-name" data-k="models.rows[key=pe].name" data-f="raw">Private equity fund</span></button>
      <dl class="fig-models-rows">
        <div class="fig-models-row"><dt>Who pays</dt><dd data-k="models.rows[key=pe].who_pays" data-f="raw">Institutions invest in a fund that buys many companies</dd></div>
        <div class="fig-models-row"><dt>Owner share</dt><dd data-k="models.rows[key=pe].owner_share" data-f="raw">Fund owns control; managers share the profits</dd></div>
        <div class="fig-models-row"><dt>Size</dt><dd data-k="models.rows[key=pe].size" data-f="raw">Middle-market buyouts averaged 7.0x EBITDA in Q2 2026</dd></div>
        <div class="fig-models-row"><dt>Time</dt><dd data-k="models.rows[key=pe].time" data-f="raw">Holds about 7 years</dd></div>
      </dl>
      <div class="fig-models-res" id="fig-models-r-pe">
        <p class="fig-models-rl">The evidence</p>
        <p class="fig-models-rv" data-k="models.rows[key=pe].result" data-f="raw">Total debt about 2.9x EBITDA on new platform buyouts</p>
      </div>
    </li>
  </ul>
  <p class="sr-only fig-models-live" aria-live="polite"></p>
  <figcaption>Sources: Stanford 2026 Search Fund Study; GoSBA Loans 2026; Revision Legal 2026; Fredrikson &amp; Byron 2025; SBA 7(a) loans page; GF Data via ACG 2026; Bain 2026. Searcher ownership shares vary by source. IRR is the yearly return on invested money. EBITDA is profit before interest, taxes and the wear on assets. A platform is a fund's first purchase in an area, which it builds on. The SBA loan limit is one reading of the current SBA rules; confirm with your lender.</figcaption>
</figure>
