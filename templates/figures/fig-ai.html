<figure class="fig" id="fig-ai" aria-labelledby="fig-ai-t">
<p class="fig-title" id="fig-ai-t">Find the slow, manual work, then build the tool</p>
<p class="fig-sub">An agentic workflow is a small custom tool that does a chain of steps by itself, such as reading a request, drafting a reply and handing it to a person to approve.</p>
<p class="fig-ai-hint-line" hidden>Tap a tile to flip it, or use the buttons to flip them all.</p>
<div class="seg" role="group" aria-label="What every tile shows" hidden>
<button type="button" aria-pressed="true" data-face="today">Today</button>
<button type="button" aria-pressed="false" data-face="ai">With an agentic workflow</button>
</div>
<ul class="fig-ai-grid" role="list">
<li class="fig-ai-tile"><span class="fig-ai-bar" aria-hidden="true"></span>
<p class="fig-ai-dept">Operations</p>
<div class="fig-ai-face fig-ai-today"><p class="fig-ai-k">Today</p><p class="fig-ai-v">Quotes are typed by hand.</p></div>
<div class="fig-ai-face fig-ai-with"><p class="fig-ai-k">With an agentic workflow</p><p class="fig-ai-v">A workflow drafts the quote from the job details for a person to approve.</p></div>
<p class="fig-ai-measure"><span class="fig-ai-k">Measure</span> Quote turnaround time</p>
</li>
<li class="fig-ai-tile"><span class="fig-ai-bar" aria-hidden="true"></span>
<p class="fig-ai-dept">Sales</p>
<div class="fig-ai-face fig-ai-today"><p class="fig-ai-k">Today</p><p class="fig-ai-v">Leads are followed up when someone remembers.</p></div>
<div class="fig-ai-face fig-ai-with"><p class="fig-ai-k">With an agentic workflow</p><p class="fig-ai-v">Every lead gets a same-day reply and a reminder.</p></div>
<p class="fig-ai-measure"><span class="fig-ai-k">Measure</span> Reply time and win rate (how many quotes become jobs)</p>
</li>
<li class="fig-ai-tile"><span class="fig-ai-bar" aria-hidden="true"></span>
<p class="fig-ai-dept">Finance</p>
<div class="fig-ai-face fig-ai-today"><p class="fig-ai-k">Today</p><p class="fig-ai-v">Invoices are chased by phone.</p></div>
<div class="fig-ai-face fig-ai-with"><p class="fig-ai-k">With an agentic workflow</p><p class="fig-ai-v">Reminders go out on schedule and payments are matched to invoices.</p></div>
<p class="fig-ai-measure"><span class="fig-ai-k">Measure</span> Days to get paid</p>
</li>
<li class="fig-ai-tile"><span class="fig-ai-bar" aria-hidden="true"></span>
<p class="fig-ai-dept">Accounting</p>
<div class="fig-ai-face fig-ai-today"><p class="fig-ai-k">Today</p><p class="fig-ai-v">Closing the month's books runs on spreadsheets.</p></div>
<div class="fig-ai-face fig-ai-with"><p class="fig-ai-k">With an agentic workflow</p><p class="fig-ai-v">Transactions are sorted into categories and matched to the bank's records, ready for a person to review.</p></div>
<p class="fig-ai-measure"><span class="fig-ai-k">Measure</span> Days to close the books</p>
</li>
<li class="fig-ai-tile"><span class="fig-ai-bar" aria-hidden="true"></span>
<p class="fig-ai-dept">Reporting</p>
<div class="fig-ai-face fig-ai-today"><p class="fig-ai-k">Today</p><p class="fig-ai-v">Numbers are pulled together on Fridays.</p></div>
<div class="fig-ai-face fig-ai-with"><p class="fig-ai-k">With an agentic workflow</p><p class="fig-ai-v">A daily one-page dashboard, a screen of the key numbers, replaces it.</p></div>
<p class="fig-ai-measure"><span class="fig-ai-k">Measure</span> Hours saved</p>
</li>
<li class="fig-ai-tile"><span class="fig-ai-bar" aria-hidden="true"></span>
<p class="fig-ai-dept">People</p>
<div class="fig-ai-face fig-ai-today"><p class="fig-ai-k">Today</p><p class="fig-ai-v">New hires learn by word of mouth.</p></div>
<div class="fig-ai-face fig-ai-with"><p class="fig-ai-k">With an agentic workflow</p><p class="fig-ai-v">A checklist app walks them through the training steps.</p></div>
<p class="fig-ai-measure"><span class="fig-ai-k">Measure</span> Time to productive (how long a new hire takes to get up to speed)</p>
</li>
<li class="fig-ai-tile"><span class="fig-ai-bar" aria-hidden="true"></span>
<p class="fig-ai-dept">Customer service</p>
<div class="fig-ai-face fig-ai-today"><p class="fig-ai-k">Today</p><p class="fig-ai-v">Status calls are answered one by one.</p></div>
<div class="fig-ai-face fig-ai-with"><p class="fig-ai-k">With an agentic workflow</p><p class="fig-ai-v">Customers get automatic job updates.</p></div>
<p class="fig-ai-measure"><span class="fig-ai-k">Measure</span> Calls per job</p>
</li>
</ul>
<p class="fig-ai-human"><svg class="fig-ai-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.6 2.7-6 6-6s6 2.4 6 6"/><path d="M15.5 10.5l2.2 2.2 4-4.4"/></svg><span>A person approves anything that goes to a customer or moves money.</span></p>
<p class="sr-only fig-ai-live" aria-live="polite"></p>
<figcaption>Examples of the work I would start with. A bet, not a promise.</figcaption>
</figure>
