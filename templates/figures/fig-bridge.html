<figure class="fig" id="fig-bridge" aria-labelledby="fig-bridge-t">
  <p class="fig-title" id="fig-bridge-t">Three engines make the money, and a big enough drop in earnings erases the buyer's cash</p>
  <p class="fig-sub">Pick a scenario. Engine 1 is earnings growth, engine 2 is the multiple (the price as a number of years of earnings) and engine 3 is paying the loan down. Bars are dollars, from the price paid to what the owner keeps.</p>
  <div class="fig-bridge-controls" id="fig-bridge-controls"></div>
  <p class="fig-bridge-desc" id="fig-bridge-desc">In this scenario, earnings grow <span data-k="scenarios.base.growth_pct" data-f="p0">7%</span> a year for <span data-k="scenarios.base.hold_years" data-f="n0">6</span> years, and the company sells at <span data-k="scenarios.base.exit_multiple" data-f="x1">4.5x</span>, up from <span data-k="inputs.entry_multiple" data-f="x1">4.0x</span> at purchase.</p>
  <div class="chart" id="fig-bridge-chart" role="img" aria-label="Waterfall chart from the price paid to the owner's proceeds. Earnings growth and the multiple change the price, then the SBA loan still owed and the seller note come off what is left. Pick a scenario above to change it."></div>
  <div class="fallback"><!-- TABLE:bridge --><!-- TABLE:scenarios --></div>
  <p class="fig-bridge-result" id="fig-bridge-ok">Proceeds <span id="fig-bridge-v-proceeds" data-k="scenarios.base.bridge.owner_proceeds" data-f="M2">$4.47M</span> on <span id="fig-bridge-v-cash" data-k="scenarios.base.buyer_cash_in" data-f="K0">$213K</span> of the buyer's cash: <span id="fig-bridge-v-moic" data-k="scenarios.base.moic_proceeds_only" data-f="x1">21.0x</span> in <span id="fig-bridge-v-years" data-k="scenarios.base.hold_years" data-f="n0">6</span> years, IRR <span id="fig-bridge-v-irr" data-k="scenarios.base.irr_proceeds_only_pct" data-f="p0">66%</span>. Proceeds only; ignores fees and taxes.</p>
  <p class="fig-bridge-result fig-bridge-bust" id="fig-bridge-bust" hidden>The sale does not cover the loans: the buyer's cash is gone, and cash falls short of the loan payment by <span data-k="scenarios.break.yearly_shortfall" data-f="K0">$80K</span> a year.</p>
  <p class="fig-bridge-dscr" id="fig-bridge-dscr"><span class="fig-bridge-badge fig-bridge-pass" id="fig-bridge-badge"><svg class="fig-bridge-ico-pass" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg><svg class="fig-bridge-ico-fail" viewBox="0 0 16 16" aria-hidden="true" focusable="false" hidden><path d="M4 4l8 8M12 4l-8 8"/></svg><span id="fig-bridge-badge-word">Bank test: passes</span></span> Lowest DSCR in the hold: <span id="fig-bridge-v-dscr" data-k="scenarios.base.min_dscr" data-f="x2">1.43x</span>. The lender in this example wants at least <span data-k="inputs.dscr_floor" data-f="x2">1.25x</span>.</p>
  <p class="fig-bridge-gloss">SBA loan: a bank loan partly guaranteed by the US Small Business Administration. Seller note: part of the price, paid later with interest. MOIC: proceeds divided by the cash put in. IRR: the yearly rate that turns the cash put in into the proceeds. DSCR: cash available for the loan payment divided by the payment.</p>
  <p class="sr-only fig-bridge-live" id="fig-bridge-live" aria-live="polite"></p>
  <figcaption>Illustrative company: <span data-k="inputs.ebitda" data-f="M1">$1.0M</span> of EBITDA on <span data-k="inputs.revenue" data-f="M1">$5.0M</span> of revenue, bought for <span data-k="scenarios.base.bridge.price_paid" data-f="M1">$4.0M</span> and sold in year <span data-k="inputs.hold_years" data-f="n0">6</span>. Scenarios, not forecasts. Returns count sale proceeds only and ignore fees and taxes. The SBA loan follows one reading of the current SBA rules; confirm with your lender. Source: the illustrative model in this repo (model/lbo_model.py).</figcaption>
</figure>
