<figure class="fig" id="fig-buybox" aria-labelledby="fig-buybox-t">
  <p class="fig-title" id="fig-buybox-t">What I look for before I look at the price</p>
  <p class="fig-sub">My eight checks, in three groups. The last one ties back to the bank test.</p>
  <div class="fig-buybox-box">
    <div class="fig-buybox-group">
      <p class="fig-buybox-h" id="fig-buybox-h1">The customers</p>
      <ul class="fig-buybox-list" role="list" aria-labelledby="fig-buybox-h1">
        <li class="fig-buybox-item">
          <svg class="fig-buybox-ck" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="11"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>
          <div class="fig-buybox-tx"><p class="fig-buybox-t">Customers come back every year</p><p class="fig-buybox-g">Repeat sales are easier to plan around.</p></div>
        </li>
        <li class="fig-buybox-item">
          <svg class="fig-buybox-ck" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="11"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>
          <div class="fig-buybox-tx"><p class="fig-buybox-t">No single customer is too big a share</p><p class="fig-buybox-g">Losing one should not break the loan payment.</p></div>
        </li>
        <li class="fig-buybox-item">
          <svg class="fig-buybox-ck" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="11"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>
          <div class="fig-buybox-tx"><p class="fig-buybox-t">An essential, unglamorous service</p><p class="fig-buybox-g">Boring and needed beats exciting and optional.</p></div>
        </li>
      </ul>
    </div>
    <div class="fig-buybox-group">
      <p class="fig-buybox-h" id="fig-buybox-h2">The company</p>
      <ul class="fig-buybox-list" role="list" aria-labelledby="fig-buybox-h2">
        <li class="fig-buybox-item">
          <svg class="fig-buybox-ck" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="11"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>
          <div class="fig-buybox-tx"><p class="fig-buybox-t">Steady margins in a bad year</p><p class="fig-buybox-g">Profit that holds up when sales dip.</p></div>
        </li>
        <li class="fig-buybox-item">
          <svg class="fig-buybox-ck" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="11"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>
          <div class="fig-buybox-tx"><p class="fig-buybox-t">Many small competitors</p><p class="fig-buybox-g">Room to grow by buying neighbors.</p></div>
        </li>
        <li class="fig-buybox-item">
          <svg class="fig-buybox-ck" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="11"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>
          <div class="fig-buybox-tx"><p class="fig-buybox-t">A team that can run without the owner</p><p class="fig-buybox-g">The company should not depend on one person.</p></div>
        </li>
      </ul>
    </div>
    <div class="fig-buybox-group">
      <p class="fig-buybox-h" id="fig-buybox-h3">The deal</p>
      <ul class="fig-buybox-list" role="list" aria-labelledby="fig-buybox-h3">
        <li class="fig-buybox-item">
          <svg class="fig-buybox-ck" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="11"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>
          <div class="fig-buybox-tx"><p class="fig-buybox-t">An owner ready to hand over</p><p class="fig-buybox-g">Many owners have no plan for who takes over.</p></div>
        </li>
        <li class="fig-buybox-item fig-buybox-bank">
          <svg class="fig-buybox-ck" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="11"/><path d="M7 12.5l3.2 3.2L17 9"/></svg>
          <div class="fig-buybox-tx"><p class="fig-buybox-t">A price the cash flow can carry</p><p class="fig-buybox-g">The bank test: yearly cash of at least <span class="num" data-k="inputs.dscr_floor" data-f="x2">1.25x</span> the loan payment.</p></div>
        </li>
      </ul>
    </div>
  </div>
  <figcaption>Sources: RSM US 2026 (value drivers); JPMorgan Chase 2026 (owners without a succession plan); SBA lending rules (<span class="num" data-k="inputs.dscr_floor" data-f="x2">1.25x</span>, one law firm's reading). The bank test is one reading of the current SBA rules; confirm with your lender. The checklist itself is my own.</figcaption>
</figure>
