  <p class="sr-only">The company was bought for <span data-k="stack.a.price" data-f="M1">$4.0M</span>. From the bottom, the money that paid for it was an SBA loan of <span data-k="stack.a.sba_loan" data-f="M2">$3.83M</span>, a seller note of <span data-k="stack.a.standby_seller_note" data-f="K0">$213K</span> and buyer cash of <span data-k="stack.a.buyer_cash" data-f="K0">$213K</span>, <span data-k="stack.a.project_cost" data-f="M2">$4.25M</span> in all including fees and a cash cushion. Each year the company makes <span data-k="cfads" data-f="K0">$800K</span> of cash for its lenders: <span data-k="stack.a.annual_sba_payment" data-f="K0">$600K</span> pays the loan and <span data-k="stack.a.cash_left_after_payment" data-f="K0">$200K</span> is left over. The company's own cash pays back the loan that bought it.</p>
  <figcaption>Illustrative company: <span data-k="inputs.ebitda" data-f="M1">$1.0M</span> of EBITDA (yearly profit before interest, taxes, depreciation and amortization, a rough measure of cash profit) on <span data-k="inputs.revenue" data-f="M1">$5.0M</span> of revenue. Cash for lenders is EBITDA after cash taxes and equipment spending. In the house picture, the SBA loan is the mortgage, the buyer cash is the down payment and the cash for lenders is the rent. The SBA loan is a bank loan partly guaranteed by the U.S. Small Business Administration; the seller note is part of the price, paid later. Source: the author's illustrative model (model/lbo_model.py in the repo). One reading of the current SBA rules; confirm with your lender.</figcaption>
