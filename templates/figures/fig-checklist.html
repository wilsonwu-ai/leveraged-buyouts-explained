<figure class="fig" id="fig-checklist" aria-labelledby="fig-checklist-t">
<p class="fig-title" id="fig-checklist-t">Ten questions to answer before you sign</p>
<p class="fig-sub">Due diligence is the checking you do before you sign: you ask for proof of what the seller has told you. Tick each item once you have seen the proof.</p>
<p class="fig-checklist-hint" hidden>Tap a question to open it.</p>
<div class="seg" role="group" aria-label="Which questions to highlight" hidden>
<button type="button" aria-pressed="true" data-mode="all">All ten</button>
<button type="button" aria-pressed="false" data-mode="first">The three I would check first</button>
</div>
<ul class="fig-checklist-list" role="list">
<li class="fig-checklist-row" data-first>
<button type="button" class="fig-checklist-head" aria-expanded="true" aria-controls="fig-checklist-p-financial"><span class="fig-checklist-tag">Check first</span><span class="fig-checklist-name">Financial and quality of earnings</span><span class="fig-checklist-q">Are the earnings real, and will they repeat?</span></button>
<div class="fig-checklist-panel" id="fig-checklist-p-financial">
<p class="fig-checklist-why"><strong>Why I check this first.</strong> Proof of cash: do the bank deposits match the reported sales? It is one of the quickest tests of whether the earnings are real.</p>
<ul class="fig-checklist-items" role="list">
<li><label><input type="checkbox"><span>Monthly financials for three years</span></label></li>
<li><label><input type="checkbox"><span>Tax returns that tie to the books</span></label></li>
<li><label><input type="checkbox"><span>Bank deposits matched to reported sales (a check called proof of cash)</span></label></li>
</ul>
</div>
</li>
<li class="fig-checklist-row" data-first>
<button type="button" class="fig-checklist-head" aria-expanded="true" aria-controls="fig-checklist-p-customers"><span class="fig-checklist-tag">Check first</span><span class="fig-checklist-name">Customers and market</span><span class="fig-checklist-q">Will the customers stay?</span></button>
<div class="fig-checklist-panel" id="fig-checklist-p-customers">
<p class="fig-checklist-why"><strong>Why I check this first.</strong> Concentration: if a few customers make up most of the sales, one departure can sink the loan payments.</p>
<ul class="fig-checklist-items" role="list">
<li><label><input type="checkbox"><span>Top customers' share of sales</span></label></li>
<li><label><input type="checkbox"><span>Contract renewal dates</span></label></li>
<li><label><input type="checkbox"><span>Price history and any lost customers</span></label></li>
</ul>
</div>
</li>
<li class="fig-checklist-row">
<button type="button" class="fig-checklist-head" aria-expanded="true" aria-controls="fig-checklist-p-tax"><span class="fig-checklist-name">Tax</span><span class="fig-checklist-q">Is there a hidden tax bill?</span></button>
<div class="fig-checklist-panel" id="fig-checklist-p-tax">
<ul class="fig-checklist-items" role="list">
<li><label><input type="checkbox"><span>Sales tax filings</span></label></li>
<li><label><input type="checkbox"><span>Payroll tax filings</span></label></li>
<li><label><input type="checkbox"><span>Notices or audits from tax agencies</span></label></li>
</ul>
</div>
</li>
<li class="fig-checklist-row">
<button type="button" class="fig-checklist-head" aria-expanded="true" aria-controls="fig-checklist-p-legal"><span class="fig-checklist-name">Legal and contracts</span><span class="fig-checklist-q">What am I signing up for?</span></button>
<div class="fig-checklist-panel" id="fig-checklist-p-legal">
<ul class="fig-checklist-items" role="list">
<li><label><input type="checkbox"><span>Material (important) contracts, and whether they can be assigned to a new owner</span></label></li>
<li><label><input type="checkbox"><span>Leases and any lawsuits</span></label></li>
<li><label><input type="checkbox"><span>Licenses and permits</span></label></li>
</ul>
</div>
</li>
<li class="fig-checklist-row" data-first>
<button type="button" class="fig-checklist-head" aria-expanded="true" aria-controls="fig-checklist-p-people"><span class="fig-checklist-tag">Check first</span><span class="fig-checklist-name">People</span><span class="fig-checklist-q">Who really runs the place?</span></button>
<div class="fig-checklist-panel" id="fig-checklist-p-people">
<p class="fig-checklist-why"><strong>Why I check this first.</strong> Does it run without the owner? If every customer and decision goes through one person, the value can leave with them.</p>
<ul class="fig-checklist-items" role="list">
<li><label><input type="checkbox"><span>Key employees</span></label></li>
<li><label><input type="checkbox"><span>Pay compared with the market</span></label></li>
<li><label><input type="checkbox"><span>Who holds the customer relationships</span></label></li>
</ul>
</div>
</li>
<li class="fig-checklist-row">
<button type="button" class="fig-checklist-head" aria-expanded="true" aria-controls="fig-checklist-p-ops"><span class="fig-checklist-name">Operations</span><span class="fig-checklist-q">How does the work get done?</span></button>
<div class="fig-checklist-panel" id="fig-checklist-p-ops">
<ul class="fig-checklist-items" role="list">
<li><label><input type="checkbox"><span>Equipment condition</span></label></li>
<li><label><input type="checkbox"><span>Key suppliers</span></label></li>
<li><label><input type="checkbox"><span>Capacity: how much more work the team and equipment can handle</span></label></li>
</ul>
</div>
</li>
<li class="fig-checklist-row">
<button type="button" class="fig-checklist-head" aria-expanded="true" aria-controls="fig-checklist-p-tech"><span class="fig-checklist-name">Technology</span><span class="fig-checklist-q">What systems run the business, and who owns the data?</span></button>
<div class="fig-checklist-panel" id="fig-checklist-p-tech">
<ul class="fig-checklist-items" role="list">
<li><label><input type="checkbox"><span>Software the company runs on</span></label></li>
<li><label><input type="checkbox"><span>Who owns the data and the accounts</span></label></li>
<li><label><input type="checkbox"><span>Backups, and whether they have been tested</span></label></li>
</ul>
</div>
</li>
<li class="fig-checklist-row">
<button type="button" class="fig-checklist-head" aria-expanded="true" aria-controls="fig-checklist-p-cyber"><span class="fig-checklist-name">Cybersecurity</span><span class="fig-checklist-q">Has anything been breached?</span></button>
<div class="fig-checklist-panel" id="fig-checklist-p-cyber">
<ul class="fig-checklist-items" role="list">
<li><label><input type="checkbox"><span>Past incidents, such as hacks or scams</span></label></li>
<li><label><input type="checkbox"><span>Who can get into which systems (access controls)</span></label></li>
<li><label><input type="checkbox"><span>Where customer data is stored</span></label></li>
</ul>
</div>
</li>
<li class="fig-checklist-row">
<button type="button" class="fig-checklist-head" aria-expanded="true" aria-controls="fig-checklist-p-env"><span class="fig-checklist-name">Environmental and real estate</span><span class="fig-checklist-q">Is there a problem in the ground or the lease?</span></button>
<div class="fig-checklist-panel" id="fig-checklist-p-env">
<ul class="fig-checklist-items" role="list">
<li><label><input type="checkbox"><span>Environmental reports</span></label></li>
<li><label><input type="checkbox"><span>Permits</span></label></li>
<li><label><input type="checkbox"><span>Zoning (what the land may be used for)</span></label></li>
</ul>
</div>
</li>
<li class="fig-checklist-row">
<button type="button" class="fig-checklist-head" aria-expanded="true" aria-controls="fig-checklist-p-ins"><span class="fig-checklist-name">Insurance</span><span class="fig-checklist-q">What has gone wrong before?</span></button>
<div class="fig-checklist-panel" id="fig-checklist-p-ins">
<ul class="fig-checklist-items" role="list">
<li><label><input type="checkbox"><span>Loss runs (the insurer's list of past claims)</span></label></li>
<li><label><input type="checkbox"><span>Claims and what caused them</span></label></li>
<li><label><input type="checkbox"><span>Gaps in coverage</span></label></li>
</ul>
</div>
</li>
</ul>
<p class="fig-checklist-note">A starting list, not a complete one. Your lawyer and accountant will add to it.</p>
<p class="sr-only fig-checklist-live" aria-live="polite"></p>
<figcaption>Sources: BD Emerson 2026 due diligence checklist; SBA guide to buying a business. Which three come first is my own judgment, not a rule.</figcaption>
</figure>
