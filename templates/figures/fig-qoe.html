<figure class="fig" id="fig-qoe" aria-labelledby="fig-qoe-t">
  <p class="fig-title" id="fig-qoe-t">A <span data-k="qoe.gap" data-f="K0">$250K</span> gap in earnings becomes a <span data-k="qoe.overpay" data-f="M1">$1.0M</span> gap in the price</p>
  <p class="fig-sub">Buyers pay a multiple of yearly earnings. At <span data-k="qoe.multiple" data-f="x1">4.0x</span>, every $1 of earnings that is not real costs $<span data-k="qoe.multiple" data-f="n0">4</span> at the closing table. Read down: the seller's number, three corrections, then the price each number would set.</p>
  <div class="chart" id="fig-qoe-chart" role="img" aria-label="Waterfall chart. The seller's earnings, minus three corrections, leave the earnings that hold up. Priced at the same multiple, the gap in earnings becomes a much bigger gap in the price."></div>
  <div class="fallback"><!-- TABLE:qoe --></div>
  <p class="fig-qoe-callout">At <span data-k="qoe.multiple" data-f="x1">4.0x</span>, the seller's number would set a price of <span data-k="qoe.price_on_claimed" data-f="M1">$5.0M</span>. The number that holds up would set <span data-k="qoe.price_on_verified" data-f="M1">$4.0M</span>. The difference, <span data-k="qoe.overpay" data-f="M1">$1.0M</span>, is what you would overpay.</p>
  <p class="fig-qoe-gloss">EBITDA is a company's yearly profit before interest, taxes, depreciation and amortization (accounting charges that spread the cost of equipment and other purchases over the years): the number most buyers use to price a company worth $2M or more (smaller owner-run companies are usually priced on SDE). A quality of earnings report (QoE) is an accountant's check of whether that number is real. An add-back is a cost the seller removes from the books because they say it will not happen again. A multiple of <span data-k="qoe.multiple" data-f="x1">4.0x</span> means a price equal to <span data-k="qoe.multiple" data-f="n0">4</span> years of earnings.</p>
  <figcaption>Illustrative company: <span data-k="inputs.ebitda" data-f="M1">$1.0M</span> of EBITDA on <span data-k="inputs.revenue" data-f="M1">$5.0M</span> of revenue. The three corrections are examples of common quality of earnings findings, not a real company. Source: the illustrative model in this repo (model/lbo_model.py).</figcaption>
</figure>
